version: '3.8'

services:

  #######################CORE#######################

  # Media Server
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    hostname: My-plex-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - VERSION=docker
      - PLEX_CLAIM=claim-1Cfz414fZn5kX7tpm2Hq
    volumes:
      - ./config/plex:/config
      - /srv:/srv
      - /mnt/storage:/storage
    ports:
      - "32400:32400"
    networks:
      media-network:
      plex-lan:
        ipv4_address: 192.168.1.152
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # VPN Container for Deluge
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_CUSTOM_CONFIG=/gluetun/AirVPN_Netherlands_UDP-443-Entry3.ovpn
      - TZ=Europe/Paris
      - FIREWALL_OUTBOUND_SUBNETS=172.18.0.0/16,172.19.0.0/16,192.168.1.0/24
      - FIREWALL_VPN_INPUT_PORTS=28605  # Replace with port from AirVPN website
      - PUID=1000
      - PGID=1000
      - DOT=off
    volumes:
      - ./config/gluetun:/gluetun
    ports:
      - "8112:8112"  # Deluge WebUI
      - "58846:58846"  # Deluge daemon
      - "8083:8083"  # qBittorrent WebUI (NEW)
      - "8191:8191"   # ← ADD THIS for FlareSolverr
      - "9696:9696"  # Prowlarr (if not using network_mode: service)
      - "28605:28605"  # Replace with your forwarded port
      - "28605:28605/udp"  # Replace with your forwarded port
    networks:
      - media-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Torrent Client (through VPN)
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    network_mode: "service:gluetun"  # Route through VPN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - DELUGE_LOGLEVEL=error
    volumes:
      - ./config/deluge:/config
      - /srv:/srv
      - /mnt/storage:/storage
      - /mnt/racing-ssd:/race
    depends_on:
      - gluetun
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Usenet Download Client
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - HAS_IPV6=false
    volumes:
      - ./config/sabnzbd:/config
      - /srv:/srv  # Same path structure as your other services
      - /mnt/storage:/storage
      - /mnt/racing-ssd:/race
      - /home/servi7/sabnzbd:/home/servi7/sabnzbd
    ports:
      - "8085:8080"  # Note: conflicts with your fetcharr port, change one of them
    networks:
      - media-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Watchdog to restart Deluge when WebUI becomes unreachable
  gluetun-watchdog:
    build:
      context: ./gluetun-watchdog
      dockerfile: Dockerfile
    container_name: gluetun-watchdog
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - media-network
    depends_on:
      - gluetun
      - deluge
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Indexer Manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest 
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/prowlarr:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped


  #######################MANAGEMENT#######################

  # Movie Management
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/radarr:/config
      - /srv:/srv
      - /mnt/storage:/storage
      - /mnt/racing-ssd:/race
      - /home/servi7/sabnzbd:/home/servi7/sabnzbd
    ports:
      - "7878:7878"
    networks:
      - media-network
    depends_on:
      - prowlarr
      - deluge
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Tvshow Management
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/sonarr:/config
      - /srv:/srv
      - /mnt/storage:/storage
      - /mnt/racing-ssd:/race
      - /home/servi7/sabnzbd:/home/servi7/sabnzbd
    ports:
      - "8989:8989"
    networks:
      - media-network
    depends_on:
      - prowlarr
      - deluge
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Bypass Cloudflare
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/Paris
    depends_on:
      - gluetun
    # ports:
    #   - "8191:8191"
    # networks:
    #   - media-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Tautulli - Plex monitoring and statistics
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/tautulli/config:/config
      - ./config/tautulli/scripts:/scripts
    ports:
      - 8181:8181
    networks:
      - media-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - plex
      - sonarr
      - radarr
    restart: unless-stopped

  #######################QOL#######################

  #Plex watchlist integration to download via *RR stack
  fetcharr:
    image: ghcr.io/fetcharr/fetcharr:latest
    container_name: fetcharr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/fetcharr:/config
    ports:
      - "8080:8080"
    networks:
      - media-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - sonarr
      - radarr
    restart: unless-stopped

  # Subtitle Management
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/bazarr:/config
      - /srv:/srv
      - /mnt/storage:/storage
    ports:
      - "6767:6767"
    networks:
      - media-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped

  # List-Sync - Trakt recommendations to download via *RR stack
  trakt-watchlist-sync:
    build:
      context: ./trakt-watchlist-sync
      dockerfile: Dockerfile.sync
    container_name: trakt-watchlist-sync
    environment:
      - TZ=Europe/Paris
      - TRAKT_CLIENT_ID=6a329068fe5503480ceaeb5477493a75f7230a457834a0e3f3c0704e7ad0a7fc
      - TRAKT_CLIENT_SECRET=b278d963bf8e729b6c9d0cb52b1c651c1fb8d08ccd54bd6c0fc92da8df81f263
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=bcdb83d1f0be438eae81fa3274b29e7e
      - RADARR_ROOT_FOLDER=/storage/movies
      - RADARR_QUALITY_PROFILE=Any
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=7d577808c2c94fabb298ca5ed82fbadc
      - SONARR_ROOT_FOLDER=/storage/tv
      - SONARR_QUALITY_PROFILE=Any
      - POLL_INTERVAL=20
    volumes:
      - ./config/trakt-watchlist-sync:/config
    networks:
      - media-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped

  # Trakt Watchlist Cleanup - Remove from Trakt when deleted from Radarr/Sonarr
  trakt-watchlist-cleanup:
    build:
      context: ./trakt-watchlist-sync
      dockerfile: Dockerfile.cleanup
    container_name: trakt-watchlist-cleanup
    environment:
      - TZ=Europe/Paris
      - TRAKT_CLIENT_ID=6a329068fe5503480ceaeb5477493a75f7230a457834a0e3f3c0704e7ad0a7fc
      - TRAKT_CLIENT_SECRET=b278d963bf8e729b6c9d0cb52b1c651c1fb8d08ccd54bd6c0fc92da8df81f263
    volumes:
      - ./config/trakt-watchlist-sync:/config
    ports:
      - "5000:5000"
    networks:
      - media-network
    restart: unless-stopped

networks:
  media-network:
    driver: bridge

  plex-lan:
    driver: macvlan
    driver_opts:
      parent: enp5s0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254
          ip_range: 192.168.1.152/32
