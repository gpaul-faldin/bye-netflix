version: '3.8'

services:

  #######################CORE#######################

  # Media Server
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    hostname: My-plex-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - VERSION=docker
      - PLEX_CLAIM=claim-1Cfz414fZn5kX7tpm2Hq
    volumes:
      - ./config/plex:/config
      - /srv:/srv
    ports:
      - "32400:32400"
    networks:
      - media-network
    restart: unless-stopped

  # Torrent Client
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - DELUGE_LOGLEVEL=error
    volumes:
      - ./config/deluge:/config
      - /srv:/srv
    ports:
      - "8112:8112"
      - "6881:6881"
      - "6881:6881/udp"
      - "58846:58846"
    networks:
      - media-network
    restart: unless-stopped

  #YggTorrent indexer
  ygege:
    image: uwucode/ygege:latest
    container_name: ygege
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - BIND_IP=0.0.0.0
      - BIND_PORT=8715
      - LOG_LEVEL=debug
    volumes:
      - ./config/ygege/sessions:/app/sessions
      - ./config/ygege/config.json:/app/config.json
    ports:
      - 8715:8715
    networks:
      - media-network

  # Indexer Manager
  prowlarr:
    image: ghcr.io/almottier/prowlarr-ygg
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - media-network
    depends_on:
      - ygege
    restart: unless-stopped


  #######################MANAGEMENT#######################

  # Movie Management
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/radarr:/config
      - /srv:/srv
    ports:
      - "7878:7878"
    networks:
      - media-network
    depends_on:
      - prowlarr
      - deluge
    restart: unless-stopped

  # Tvshow Management
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/sonarr:/config
      - /srv:/srv
    ports:
      - "8989:8989"
    networks:
      - media-network
    depends_on:
      - prowlarr
      - deluge
    restart: unless-stopped

  # Bypass Cloudflare
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/Paris
    ports:
      - "8191:8191"
    networks:
      - media-network
    restart: unless-stopped

  # Tautulli - Plex monitoring and statistics
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/tautulli/config:/config
      - ./config/tautulli/scripts:/scripts
    ports:
      - 8181:8181
    networks:
      - media-network
    depends_on:
      - plex
      - sonarr
      - radarr
    restart: unless-stopped

  #######################QOL#######################

  #Plex watchlist integration to *RR stack
  fetcharr:
    image: ghcr.io/fetcharr/fetcharr:latest
    container_name: fetcharr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/fetcharr:/config
    ports:
      - "8080:8080"
    networks:
      - media-network
    depends_on:
      - sonarr
      - radarr
    restart: unless-stopped

  # Subtitle Management
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/bazarr:/config
      - /srv:/srv
    ports:
      - "6767:6767"
    networks:
      - media-network
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped

  # Request Management & Discovery
  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/overseerr:/config
    ports:
      - "5055:5055"
    networks:
      - media-network
    depends_on:
      - plex
      - radarr
      - sonarr
    restart: unless-stopped

  # Push information to trakt
  # plextraktsync:
  #   image: ghcr.io/taxel/plextraktsync
  #   command: sync
  #   container_name: plextraktsync
  #   volumes:
  #     - ./config/plexTraktSync:/app/config
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Europe/Paris
  #   networks:
  #     - media-network
  #   depends_on:
  #     - plex
  #   restart: on-failure:2

networks:
  media-network:
    driver: bridge

